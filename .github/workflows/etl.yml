name: Layoff ETL

on:
  schedule:
    # Ogni 6 ore: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Quanti giorni indietro fetchare"
        required: false
        default: "90"

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Firebase credentials from secret
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS_JSON" ]; then
            echo "::error::Secret FIREBASE_CREDENTIALS_JSON non configurato. Vedi STREAMLIT_SECRETS_SETUP.md."
            exit 1
          fi
          mkdir -p .secrets
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > .secrets/ai-fires-sa.json
          # Sanity check: il file deve essere JSON valido con la chiave project_id
          python -c "import json; d=json.load(open('.secrets/ai-fires-sa.json')); assert d.get('project_id')=='ai-fires', 'project_id mismatch'; print('credentials OK')"

      - name: Run ETL
        run: |
          DAYS="${{ github.event.inputs.days_back || '90' }}"
          python scripts/cron_etl.py "$DAYS"
